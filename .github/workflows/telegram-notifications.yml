name: Telegram Notifications (Scheduled)

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 Brasil
    - cron: "0 15 * * *"  # 12:00 Brasil
    - cron: "0 21 * * *"  # 18:00 Brasil

  workflow_dispatch: # permite rodar manualmente também

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Call Edge Function (force telegram)
        run: |
          curl -s -X POST "$EDGE_FUNCTION_URL?force=true" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"
        env:
          EDGE_FUNCTION_URL: ${{ secrets.EDGE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
