name: Telegram Notifications (Single Source of Truth)

on:
  schedule:
    # Executa todo dia às 07:00 da manhã (horário UTC ≈ 04:00 Brasil)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Call Edge Function
        run: |
          curl -s -X POST "${EDGE_FUNCTION_URL}" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          EDGE_FUNCTION_URL: ${{ secrets.EDGE_FUNCTION_URL }}
